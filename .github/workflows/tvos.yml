name: tvOS

on:
  push:
    branches:
      - apple-tv
  pull_request:
    branches:
      - apple-tv
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

# Authenticate mise's GitHub API calls (aqua backend installs CMake/pkl/etc.)
# so tool installs don't hit the unauthenticated rate limit (403 Forbidden).
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: tvOS Simulator (Apple Silicon)
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # Need parent commit so we can diff CMake/SMDefs.cmake to detect
          # version bumps.
          fetch-depth: 2

      - name: Install build dependencies
        run: brew install nasm mise

      - name: Select Xcode
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          sudo xcode-select -s "${LATEST:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Trust mise config
        run: mise trust --yes
        env:
          MISE_YES: "1"

      - name: Read version from CMake/SMDefs.cmake
        id: version
        shell: bash
        run: |
          set -euo pipefail
          extract_version() {
            local ref="$1"
            local content
            if [ "$ref" = "WORKTREE" ]; then
              content=$(cat CMake/SMDefs.cmake)
            else
              content=$(git show "$ref":CMake/SMDefs.cmake 2>/dev/null || echo "")
            fi
            local major minor patch
            major=$(printf '%s\n' "$content" | grep -E '^set\(SM_VERSION_MAJOR' | grep -oE '[0-9]+' || true)
            minor=$(printf '%s\n' "$content" | grep -E '^set\(SM_VERSION_MINOR' | grep -oE '[0-9]+' || true)
            patch=$(printf '%s\n' "$content" | grep -E '^set\(SM_VERSION_PATCH' | grep -oE '[0-9]+' || true)
            if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
              echo ""
            else
              echo "${major}.${minor}.${patch}"
            fi
          }

          current=$(extract_version WORKTREE)
          echo "Current version: $current"
          echo "version=$current" >> "$GITHUB_OUTPUT"

          changed=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "apple-tv" ]; then
            previous=$(extract_version "HEAD^") || previous=""
            echo "Previous version: $previous"
            if [ -n "$current" ] && [ "$current" != "$previous" ]; then
              changed=true
            fi
          fi
          echo "Version changed: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Configure (tvOS Simulator)
        run: mise run tvos:configure
        env:
          MISE_EXPERIMENTAL: "1"

      - name: Build (tvOS Simulator)
        run: mise run tvos:build

      - name: Package .app bundle
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="RRRevoloution-debug.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle at $APP_PATH but it does not exist."
            ls -la
            exit 1
          fi
          VERSION="${{ steps.version.outputs.version }}"
          [ -z "$VERSION" ] && VERSION="dev"
          OUT="RRRevoloution-tvOS-${VERSION}-${GITHUB_SHA::7}.zip"
          # ditto preserves bundle structure / symlinks correctly for .app bundles
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$OUT"
          echo "artifact=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: RRRevoloution-tvOS-${{ steps.version.outputs.version || 'dev' }}-${{ github.sha }}
          path: ${{ steps.package.outputs.artifact }}
          archive: false

  device:
    name: tvOS Device (signed .ipa)
    needs: build
    # Secrets aren't available to PRs (incl. forks); only sign on push to
    # apple-tv or a manual run, and only in the canonical repo.
    if: >-
      github.repository == 'NorthIsUp/revo-revo-revoloution' &&
      github.event_name != 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Install build dependencies
        run: brew install nasm mise

      - name: Select Xcode
        run: |
          set -euo pipefail
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          sudo xcode-select -s "${LATEST:-/Applications/Xcode.app}"
          xcodebuild -version

      - name: Trust mise config
        run: mise trust --yes
        env:
          MISE_YES: "1"

      - name: Set up App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_KEY_P8}" ]; then
            echo "::error::ASC_KEY_ID / ASC_KEY_P8 secrets are not set. See Docs/tvOS-device-build.md."
            exit 1
          fi
          KEYDIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYDIR"
          KEYFILE="$KEYDIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "${ASC_KEY_P8}" | base64 --decode > "$KEYFILE"
          echo "ASC_KEY_PATH=$KEYFILE" >> "$GITHUB_ENV"

      - name: Set up distribution signing (cert + profile)
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          APP_STORE_PROFILE: ${{ secrets.APP_STORE_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "${DIST_CERT_P12}" ] || [ -z "${DIST_CERT_PASSWORD}" ] || [ -z "${APP_STORE_PROFILE}" ]; then
            echo "::error::DIST_CERT_P12 / DIST_CERT_PASSWORD / APP_STORE_PROFILE secrets are not set. See Docs/tvOS-device-build.md."
            exit 1
          fi
          # Manual App Store signing: xcodebuild can't cloud-create a
          # distribution cert/profile headlessly, so import a pre-made one.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          # Keep the new keychain in the search list alongside the defaults so
          # codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          P12="$RUNNER_TEMP/dist.p12"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
          rm -f "$P12"
          # Install the App Store provisioning profile under its own UUID.
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          TMP_PROF="$RUNNER_TEMP/appstore.mobileprovision"
          printf '%s' "$APP_STORE_PROFILE" | base64 --decode > "$TMP_PROF"
          UUID=$(security cms -D -i "$TMP_PROF" | plutil -extract UUID raw -)
          mv "$TMP_PROF" "$PROFILES/$UUID.mobileprovision"
          echo "Imported Apple Distribution cert; installed profile $UUID."

      - name: Archive + export signed .ipa
        env:
          MISE_EXPERIMENTAL: "1"
          TVOS_DEV_TEAM: ${{ secrets.TVOS_DEV_TEAM }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: mise run tvos:export

      - name: Locate .ipa
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(ls build-tvos-device/export/*.ipa | head -1)
          VERSION="${{ needs.build.outputs.version }}"
          [ -z "$VERSION" ] && VERSION="dev"
          OUT="RRRevoloution-tvOS-${VERSION}-${GITHUB_SHA::7}.ipa"
          cp "$IPA" "$OUT"
          echo "artifact=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: RRRevoloution-tvOS-ipa-${{ needs.build.outputs.version || 'dev' }}-${{ github.sha }}
          path: ${{ steps.ipa.outputs.artifact }}
          archive: false

      - name: Upload to TestFlight
        # Only on a version bump: App Store Connect rejects duplicate build
        # numbers (CFBundleVersion == SM_VERSION_TRADITIONAL).
        if: github.event_name == 'push' && github.ref_name == 'apple-tv' && needs.build.outputs.version_changed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: mise run tvos:upload

  release:
    name: Create tvOS GitHub Release
    needs: [build, device]
    if: github.event_name == 'push' && github.ref_name == 'apple-tv' && needs.build.outputs.version_changed == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download build artifacts
        # No name: downloads ALL artifacts of this run (the signed .ipa and the
        # simulator .zip). merge-multiple flattens them into ./dist.
        uses: actions/download-artifact@v6
        with:
          path: ./dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          TAG="tvos-v${VERSION}"
          TITLE="RRRevoloution tvOS v${VERSION}"
          # Idempotent: if the tag/release already exists, just upload assets.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading additional assets."
            gh release upload "$TAG" ./dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --target "$GITHUB_SHA" \
              --notes "Automated tvOS release for version ${VERSION}." \
              ./dist/*
          fi
